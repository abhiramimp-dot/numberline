
<script>
  const questions = [
    // Positive + Positive / Positive + Negative
    { start: 3, change: 5, type: 'add', text: "3 + 5" },
    { start: 2, change: -6, type: 'add', text: "2 + (-6)" },
    { start: 6, change: -4, type: 'add', text: "6 + (-4)" },
    { start: 1, change: -8, type: 'add', text: "1 + (-8)" },

    // Negative + Positive / Negative + Negative
    { start: -4, change: 7, type: 'add', text: "-4 + 7" },
    { start: -2, change: 2, type: 'add', text: "-2 + 2" },
    { start: -5, change: -3, type: 'add', text: "-5 + (-3)" },
    { start: -1, change: -6, type: 'add', text: "-1 + (-6)" },

    // Subtracting Positive Integers
    { start: 4, change: 7, type: 'sub', text: "4 - 7" },
    { start: 8, change: 3, type: 'sub', text: "8 - 3" },
    { start: -2, change: 5, type: 'sub', text: "-2 - 5" },
    { start: -3, change: 4, type: 'sub', text: "-3 - 4" },

    // Subtracting Negative Integers (Double Negatives)
    { start: 2, change: -5, type: 'sub', text: "2 - (-5)" },
    { start: 5, change: -2, type: 'sub', text: "5 - (-2)" },
    { start: -6, change: -4, type: 'sub', text: "-6 - (-4)" },
    { start: -4, change: -4, type: 'sub', text: "-4 - (-4)" },

    // Zero Combinations & Edge Cases
    { start: 0, change: -7, type: 'add', text: "0 + (-7)" },
    { start: 0, change: -6, type: 'sub', text: "0 - (-6)" },
    { start: -5, change: -5, type: 'sub', text: "-5 - (-5)" },
    { start: -3, change: 8, type: 'sub', text: "-3 - (-8)" }
  ];

  let currentQ = 0;
  let score = 0;
  const canvas = document.getElementById('numberLine');
  const ctx = canvas.getContext('2d');

  function initQuestion() {
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('user-answer').value = '';
    document.getElementById('user-answer').focus();
    
    const q = questions[currentQ];
    document.getElementById('problem-text').textContent = `Question ${currentQ + 1} of ${questions.length}: Solve ${q.text}`;
    document.getElementById('progress').style.width = `${((currentQ) / questions.length) * 100}%`;
    
    drawNumberLine(q.start, getEndValue(q));
  }

  function getEndValue(q) {
    if (q.type === 'add') return q.start + q.change;
    if (q.type === 'sub') return q.start - q.change;
  }

  function drawNumberLine(startVal, endVal, showJumps = true) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const min = -10;
    const max = 10;
    const margin = 40;
    const width = canvas.width - 2 * margin;
    const y = 100;

    const getX = (val) => margin + ((val - min) / (max - min)) * width;

    // Draw Main Axis Line
    ctx.beginPath();
    ctx.moveTo(margin - 10, y);
    ctx.lineTo(canvas.width - margin + 10, y);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw Arrows
    drawArrowhead(ctx, margin - 10, y, Math.PI);
    drawArrowhead(ctx, canvas.width - margin + 10, y, 0);

    // Draw Ticks & Labels
    for (let i = min; i <= max; i++) {
      const x = getX(i);
      ctx.beginPath();
      ctx.moveTo(x, y - 8);
      ctx.lineTo(x, y + 8);
      ctx.strokeStyle = (i === 0) ? '#1e293b' : '#94a3b8';
      ctx.lineWidth = (i === 0) ? 3 : 1.5;
      ctx.stroke();

      ctx.font = (i === 0) ? 'bold 14px sans-serif' : '12px sans-serif';
      ctx.fillStyle = (i === 0) ? '#0f172a' : '#64748b';
      ctx.textAlign = 'center';
      ctx.fillText(i.toString(), x, y + 25);
    }

    if (showJumps) {
      // Step 1: Start at Origin to First Point
      drawArc(ctx, getX(0), getX(startVal), y, '#2563eb', 'Start: ' + startVal);
      // Step 2: Jump to Final Result
      drawArc(ctx, getX(startVal), getX(endVal), y, '#d97706', 'Move');
    }
  }

  function drawArc(ctx, x1, x2, y, color, label) {
    if (x1 === x2) return;
    const radius = Math.abs(x2 - x1) / 2;
    const centerX = (x1 + x2) / 2;
    const isClockwise = x2 < x1;

    ctx.beginPath();
    ctx.arc(centerX, y, radius, Math.PI, 0, isClockwise);
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Draw Directional Arrow Head
    const endAngle = isClockwise ? Math.PI : 0;
    drawArrowhead(ctx, x2, y, isClockwise ? Math.PI / 2 : -Math.PI / 2, color);
  }

  function drawArrowhead(ctx, x, y, angle, color = '#334155') {
    ctx.save();
    ctx.beginPath();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.moveTo(0, 0);
    ctx.lineTo(-6, -4);
    ctx.lineTo(-6, 4);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function checkAnswer() {
    const input = document.getElementById('user-answer').value;
    if (input === '') return;

    const userAns = parseInt(input, 10);
    const q = questions[currentQ];
    const correctAns = getEndValue(q);
    const feedback = document.getElementById('feedback');

    if (userAns === correctAns) {
      score++;
      feedback.textContent = "Correct!";
      feedback.className = "feedback correct";
    } else {
      feedback.textContent = `Incorrect. Correct answer is ${correctAns}.`;
      feedback.className = "feedback incorrect";
    }

    setTimeout(() => {
      currentQ++;
      if (currentQ < questions.length) {
        initQuestion();
      } else {
        showResults();
      }
    }, 1500);
  }

  function showResults() {
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('score-area').style.display = 'block';
    document.getElementById('progress').style.width = '100%';
    document.getElementById('final-score').textContent = 
      `You scored ${score} out of ${questions.length} (${Math.round((score / questions.length) * 100)}%)`;
  }

  function restartTest() {
    currentQ = 0;
    score = 0;
    document.getElementById('quiz-area').style.display = 'block';
    document.getElementById('score-area').style.display = 'none';
    initQuestion();
  }

  document.getElementById('user-answer').addEventListener('keyup', function(event) {
    if (event.key === 'Enter') {
      checkAnswer();
    }
  });

  initQuestion();
</script>
